name: Build Release (Android + Desktop)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish to GitHub Releases? (true to publish, false to only build and upload artifacts)'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: write

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'microsoft'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Android Full APK Build & Sign
  # ---------------------------------------------------------------------------
  android-full:
    name: Android Full APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'gradle'

      - name: Write local.properties
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          cat > ./local.properties << EOF
          SENTRY_DSN=${SENTRY_DSN}
          SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
          LASTFM_API_KEY=${LASTFM_API_KEY}
          LASTFM_SECRET=${LASTFM_SECRET}
          EOF

      - name: Write keystore
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
        run: |
          if [ -n "$BASE_64_SIGNING_KEY" ]; then
            echo "$BASE_64_SIGNING_KEY" | base64 -d > simpmusic.jks
          else
            echo "BASE_64_SIGNING_KEY not set. An automated self-signed keystore will be generated."
          fi

      - name: Set full build flag
        run: |
          sed -i 's/isFullBuild=false/isFullBuild=true/g' ./gradle.properties || echo "isFullBuild=true" >> ./gradle.properties

      - name: Make scripts executable
        run: chmod +x ./gradlew ./build_and_sign_apk.sh

      - name: Build & sign Android Full APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./build_and_sign_apk.sh --release --full

      - name: Upload Full APK
        uses: actions/upload-artifact@v4
        with:
          name: android-full-apk
          path: androidApp/build/outputs/apk/release/*.apk

  # ---------------------------------------------------------------------------
  # Android FOSS APK Build & Sign
  # ---------------------------------------------------------------------------
  android-foss:
    name: Android FOSS APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'gradle'

      - name: Write keystore
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
        run: |
          if [ -n "$BASE_64_SIGNING_KEY" ]; then
            echo "$BASE_64_SIGNING_KEY" | base64 -d > simpmusic.jks
          else
            echo "BASE_64_SIGNING_KEY not set. An automated self-signed keystore will be generated."
          fi

      - name: Set foss build flag
        run: |
          sed -i 's/isFullBuild=true/isFullBuild=false/g' ./gradle.properties || echo "isFullBuild=false" >> ./gradle.properties

      - name: Make scripts executable
        run: chmod +x ./gradlew ./build_and_sign_apk.sh

      - name: Build & sign Android FOSS APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./build_and_sign_apk.sh --release --foss

      - name: Upload FOSS APK
        uses: actions/upload-artifact@v4
        with:
          name: android-foss-apk
          path: androidApp/build/outputs/apk/release/*.apk

  # ---------------------------------------------------------------------------
  # Desktop cross-OS packages via Conveyor (Linux AppImage + Mac zip + Windows MSIX)
  # ---------------------------------------------------------------------------
  desktop-packages:
    name: Desktop Packages (Linux, Mac, Windows)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'gradle'

      - name: Install libfuse2
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Set full build flag
        run: |
          sed -i 's/isFullBuild=false/isFullBuild=true/g' ./gradle.properties || echo "isFullBuild=true" >> ./gradle.properties

      - name: Write local.properties
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_JVM || secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          cat > ./local.properties << EOF
          SENTRY_DSN=${SENTRY_DSN}
          SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
          LASTFM_API_KEY=${LASTFM_API_KEY}
          LASTFM_SECRET=${LASTFM_SECRET}
          EOF

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions --no-configuration-cache

      - name: Cache mpv-natives
        uses: actions/cache@v4
        with:
          path: mpv-natives
          key: mpv-natives-${{ hashFiles('composeApp/build.gradle.kts') }}

      - name: Populate mpv-natives for all OSes
        run: ./gradlew :composeApp:mpvSetupAll --no-configuration-cache

      - name: Generate Conveyor config
        run: ./gradlew :desktopApp:writeConveyorConfig --no-configuration-cache

      - name: Install Conveyor
        run: |
          CONVEYOR_VERSION="22.2"
          wget -q https://downloads.hydraulic.dev/conveyor/conveyor-${CONVEYOR_VERSION}-linux-amd64.tar.gz
          sudo mkdir -p /opt/conveyor
          sudo tar -xzf conveyor-${CONVEYOR_VERSION}-linux-amd64.tar.gz -C /opt/conveyor --strip-components=1
          echo "/opt/conveyor/bin" >> "$GITHUB_PATH"

      - name: Setup Conveyor Signing Key
        env:
          CONVEYOR_SIGNING_KEY: ${{ secrets.CONVEYOR_SIGNING_KEY }}
        run: |
          mkdir -p ~/.config/conveyor
          if [ -n "$CONVEYOR_SIGNING_KEY" ]; then
            echo "app.signing-key = \"$CONVEYOR_SIGNING_KEY\"" > ~/.config/conveyor/defaults.conf
          else
            echo "CONVEYOR_SIGNING_KEY not provided. Generating temporary root key for signing..."
            conveyor keys generate --passphrase=""
          fi

      - name: Build Linux app
        run: |
          conveyor --agree-to-license=1 -Kapp.machines=linux.amd64.glibc make linux-app

      - name: Wrap Linux app tree to AppImage
        run: ./gradlew :desktopApp:packageConveyorAppImage --no-configuration-cache

      - name: Build Mac and Windows packages
        run: |
          conveyor --agree-to-license=1 '-Kapp.machines=[mac.amd64,mac.aarch64,windows.amd64] make site'

      - name: Stage AppImage into output/
        run: cp desktopApp/build/appimage/conveyor/SimpMusic-*.AppImage output/

      - name: Bundle Windows offline installer
        run: |
          set -euo pipefail
          if [ ! -f output/simpmusic.crt ]; then
            echo "::error::output/simpmusic.crt missing — Conveyor signing must have failed"
            exit 1
          fi
          msix=$(ls output/simpmusic-*.x64.msix 2>/dev/null | head -1)
          if [ -z "$msix" ]; then
            echo "::error::No simpmusic-*.x64.msix found in output/"
            exit 1
          fi
          mkdir -p installers/
          stage="$(mktemp -d)"
          cp scripts/windows/install.bat "$stage/"
          cp output/simpmusic.crt        "$stage/"
          cp "$msix"                      "$stage/"
          ( cd "$stage" && zip -q -j \
            "${GITHUB_WORKSPACE}/installers/SimpMusic-Windows-installer.zip" \
            install.bat simpmusic.crt "$(basename "$msix")" )
          rm -rf "$stage"
          ls -lh installers/

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-appimage
          path: output/SimpMusic-*.AppImage

      - name: Upload Windows offline installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-installer
          path: installers/SimpMusic-Windows-installer.zip

      - name: Upload Windows MSIX
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-msix
          path: output/simpmusic-*.x64.msix

      - name: Upload macOS zips
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-zips
          path: output/*.zip

  # ---------------------------------------------------------------------------
  # Wrap macOS .zip → .dmg (macOS runner for create-dmg + hdiutil)
  # ---------------------------------------------------------------------------
  wrap-mac-dmg:
    name: Wrap macOS .zip to .dmg
    runs-on: macos-14
    needs: desktop-packages
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install create-dmg + ImageMagick
        run: brew install create-dmg imagemagick

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Download Mac .zip artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-mac-zips
          path: mac-zips

      - name: Prepare background
        run: |
          mkdir -p build/dmg
          magick composeApp/icon/dmg-background.png \
            -filter Lanczos -resize 1400x800 \
            build/dmg/dmg-bg-1400x800.png

      - name: Make scripts executable
        run: chmod +x scripts/wrap-mac-dmg.sh

      - name: Wrap each Mac .zip into .dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for zip in mac-zips/simpmusic-*-mac-*.zip; do
            arch="$(basename "$zip" | sed -nE 's/.*-mac-([a-z0-9]+)\.zip/\1/p')"
            [[ -z "$arch" ]] && { echo "Cannot infer arch from $zip" >&2; exit 1; }
            workdir="$(mktemp -d)"
            unzip -q "$zip" -d "$workdir"
            app="$(find "$workdir" -maxdepth 2 -type d -name '*.app' | head -1)"
            [[ -d "$app" ]] || { echo "No .app inside $zip" >&2; exit 1; }
            out="dist/SimpMusic-${VERSION}-mac-${arch}.dmg"
            scripts/wrap-mac-dmg.sh \
              "$app" \
              build/dmg/dmg-bg-1400x800.png \
              composeApp/icon/circle_app_icon.icns \
              "$out"
            rm -rf "$workdir"
          done
          ls -lh dist/

      - name: Upload Mac .dmg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-dmg
          path: dist/*.dmg

  # ---------------------------------------------------------------------------
  # Publish Release (Triggered on tag push or manual dispatch with publish flag)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    if: |
      (always() && !cancelled()) &&
      (needs.android-full.result == 'success') &&
      (needs.android-foss.result == 'success') &&
      (needs.desktop-packages.result == 'success') &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true))
    needs:
      - android-full
      - android-foss
      - desktop-packages
      - wrap-mac-dmg
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Read app version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep '^version-name' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)
            echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Android Full APK
        uses: actions/download-artifact@v4
        with:
          name: android-full-apk
          path: release

      - name: Download Android FOSS APK
        uses: actions/download-artifact@v4
        with:
          name: android-foss-apk
          path: release

      - name: Download Windows offline installer
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-installer
          path: release

      - name: Download Windows MSIX
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-msix
          path: release

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: desktop-linux-appimage
          path: release

      - name: Download Mac DMG
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: desktop-mac-dmg
          path: release

      - name: Download Mac Zips (fallback if DMG not present)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: desktop-mac-zips
          path: release

      - name: List all release files
        run: ls -lh release/

      - name: Generate release body
        id: body
        run: |
          cat << 'BODY' > release_body.md
          ## Download SimpMusic

          Download the appropriate package for your platform below.

          ### Android

          | Variant | Description |
          |---------|-------------|
          | **Full** | Includes Sentry crash reporting and Last.fm scrobbling |
          | **FOSS** | No tracking, compatible with F-Droid |

          > ⚠️ **Important**: Android 12+ required for the best experience (blur effects, etc.)

          ### Desktop

          | Platform | Architecture | Package |
          |----------|-------------|---------|
          | **Windows** | x86_64 | `SimpMusic-Windows-installer.zip` (Offline installer: includes cert + MSIX) / `simpmusic-*.x64.msix` |
          | **macOS** | Intel / Apple Silicon | `SimpMusic-*-mac-*.dmg` |
          | **Linux** | x86_64 | `SimpMusic-*-x86_64.AppImage` |

          > **Note for Windows**: Extract `SimpMusic-Windows-installer.zip` and run `install.bat` (or sideload the `.msix` directly after enabling developer mode).
          >
          > **Note for Linux**: Make the AppImage executable (`chmod +x SimpMusic-*.AppImage`) and run it.

          ### Release Notes

          See the [CHANGELOG](https://github.com/maxrave-dev/SimpMusic/blob/main/CHANGELOG.md) for full details.
          BODY
          echo "body_file=release_body.md" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: SimpMusic ${{ steps.version.outputs.version }}
          body_path: ${{ steps.body.outputs.body_file }}
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
